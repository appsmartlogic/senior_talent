{% extends 'talent_app/base.html' %}
{% block title %}Recuperar contraseña · SeniorTalent{% endblock %}

{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;">
  <div style="background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:40px 36px;max-width:420px;width:100%;">

    <div style="text-align:center;margin-bottom:28px;">
      <h1 style="font-size:20px;font-weight:600;color:#0A0A2E;margin:0 0 8px;">¿Olvidaste tu contraseña?</h1>
      <p style="font-size:14px;color:#666;margin:0;line-height:1.5;">
        Escribe tu correo y te enviaremos un enlace para crear una nueva contraseña.
      </p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:13px;color:#444;margin-bottom:6px;font-weight:500;">
          Correo electrónico
        </label>
        <input type="email" name="email" required autofocus
               placeholder="tu@empresa.com"
               style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;"
               onfocus="this.style.borderColor='#5349B7'" onblur="this.style.borderColor='#ddd'">
      </div>

      <button type="submit"
              style="width:100%;padding:12px;background:#5349B7;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">
        Enviar enlace de recuperación
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;">
      <a href="{% url 'login' %}" style="font-size:13px;color:#5349B7;text-decoration:none;">
        ← Volver al inicio de sesión
      </a>
    </div>

  </div>
</div>
{% endblock %}
